[package]
name = "rose-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rose-core = { path = "../rose-core" }
rose-agent = { path = "../rose-agent" }
async-trait = "0.1"
axum = "0.8"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
