# Rose example config. Copy to ~/.config/rose/config.toml and edit.
# Secrets NEVER go here - they come from env (ROSE_MUSE_API_KEY, ...).
# See IMPLEMENTATION.md T0.3.

[server]
# UI + API listen address. 127.0.0.1 = localhost only (tunnel is the perimeter).
# Never bind 0.0.0.0 unless allow_remote = true (and you know why).
bind = "127.0.0.1:8787"
allow_remote = false

[desktop]
# "auto" (recommended: X11 desktop, CDP whenever a Chrome window is frontmost)
# | "x11" (full desktop via pixels) | "cdp" (browser tabs only, no native UI)
# | "fake" (tests / offline dev).
backend = "auto"
display = ":1"
width = 1600
height = 900

[cdp]
# CDP endpoint of the VM's existing Chrome (google-chrome-stable launched
# with --remote-debugging-port=9222). No Chromium install: chromiumoxide
# speaks CDP to any recent Chrome and reuses its logged-in profile.
# Start Chrome once, e.g.:
#   google-chrome-stable --remote-debugging-port=9222 --user-data-dir=~/.config/rose/chrome-profile &
# (Chrome refuses remote debugging on its *default* profile dir, so the CDP
# browser must use a non-default dir; setup.sh/deploy.sh migrate the existing
# profile there one-time, logins kept.)
endpoint = "http://127.0.0.1:9222"
# If true and the endpoint refuses, launch the detected chrome binary
# headed (1600x900 on :1) instead of failing the step.
launch_if_missing = false
# Override chrome binary auto-detect
# (google-chrome-stable | google-chrome | chromium-browser | ...).
# Empty = auto-detect, CHROME_BIN env wins over this.
chrome_binary = ""

[models]
# "muse" (Muse Spark 1.3, T3.1) | "fake" (scripted replies, no API key).
brain = "muse"
# Meta Model API base (OpenAI-compatible). Change for proxies/tests.
endpoint = "https://api.meta.ai/v1"
# Contributor tier: low cost, one call per step.
model = "muse-spark-1.3-contributor"

# Vision grounding is not configured: the brain only ever sees gridded
# screenshots — the backend's DOM/AX element list as text when it has
# one (browser pages), the constant axis-numbered 64x36 grid everywhere
# else. Raw screenshots are never sent; a frame that cannot be gridded
# fails the step instead.

[policy]
max_steps = 40
max_minutes = 15
max_model_calls = 60
require_approval_for = ["submit", "send", "pay", "delete", "publish"]

[data]
dir = "~/.local/share/rose"
