# Rose example config. Copy to ~/.config/rose/config.toml and edit.
# Secrets NEVER go here - they come from env (ROSE_MUSE_API_KEY, ...).
# See IMPLEMENTATION.md T0.3.

[server]
# UI + API listen address. 127.0.0.1 = localhost only (tunnel is the perimeter).
# Never bind 0.0.0.0 unless allow_remote = true (and you know why).
bind = "127.0.0.1:8787"
allow_remote = false

[desktop]
# "x11" (real, T1.2) | "fake" (tests / offline dev).
backend = "x11"
display = ":1"
width = 1600
height = 900

[models]
# "muse" (Muse Spark 1.3, T3.1) | "fake" (scripted replies, no API key).
brain = "muse"
# Meta Model API base (OpenAI-compatible). Change for proxies/tests.
endpoint = "https://api.meta.ai/v1"
# Contributor tier: low cost, one call per step.
model = "muse-spark-1.3-contributor"

[policy]
max_steps = 40
max_minutes = 15
max_model_calls = 60
require_approval_for = ["submit", "send", "pay", "delete", "publish"]

[data]
dir = "~/.local/share/rose"
