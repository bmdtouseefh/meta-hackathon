# Rose example config. Copy to ~/.config/rose/config.toml and edit.
# Secrets NEVER go here - they come from env (ROSE_MUSE_API_KEY, ...).
# See IMPLEMENTATION.md T0.3.

[server]
# UI + API listen address. 127.0.0.1 = localhost only (tunnel is the perimeter).
# Never bind 0.0.0.0 unless allow_remote = true (and you know why).
bind = "127.0.0.1:8787"
allow_remote = false

[desktop]
# "x11" (full desktop, grid-based clicking — reliable on canvas, native apps,
# browser alike) | "fake" (tests / offline dev).
backend = "x11"
display = ":1"
width = 1600
height = 900

[models]
# "muse" (Muse Spark 1.3, T3.1) | "fake" (scripted replies, no API key).
brain = "muse"
# Model API base URL (OpenAI-compatible). Meta is the default; set a different
# base URL here to use another OpenAI-compatible provider/proxy (Ollama,
# LM Studio, OpenRouter, tests...). `base_url` / `endpoint` are equivalent.
# Env override (wins over this file): ROSE_MODELS_ENDPOINT (aliases:
# ROSE_MUSE_ENDPOINT, ROSE_MODELS_BASE_URL, OPENAI_BASE_URL).
endpoint = "https://api.meta.ai/v1"
# base_url = "http://localhost:11434/v1"
# Contributor tier: low cost, one call per step.
# Env override (wins over this file): ROSE_MODELS_MODEL (aliases:
# ROSE_MUSE_MODEL, OPENAI_MODEL).
model = "muse-spark-1.3-contributor"
# Separate model + base URL for video → instructions (Skill Studio).
# Empty (default) = follow `model` / `endpoint` above. Set to pin video
# drafting to a different OpenAI-compatible provider than the brain.
# Env overrides (win over this file): ROSE_MODELS_VIDEO_MODEL (aliases:
# ROSE_MUSE_VIDEO_MODEL, OPENAI_VIDEO_MODEL) and ROSE_MODELS_VIDEO_ENDPOINT
# (aliases: ROSE_MUSE_VIDEO_ENDPOINT, ROSE_MODELS_VIDEO_BASE_URL,
# OPENAI_VIDEO_BASE_URL).
# video_model = ""
# video_endpoint = "https://api.meta.ai/v1"
# Separate video key (optional): Setup → Keys (Video key) or
# ROSE_VIDEO_API_KEY. Empty = same as the Muse key (ROSE_MUSE_API_KEY).

# Vision grounding is fixed: the brain only ever sees the gridded
# screenshot (constant axis-numbered 67x39 grid). Raw screenshots are never
# sent; a frame that cannot be gridded fails the step instead.

[policy]
max_steps = 40
max_minutes = 15
max_model_calls = 60
require_approval_for = ["submit", "send", "pay", "delete", "publish"]

[data]
dir = "~/.local/share/rose"
